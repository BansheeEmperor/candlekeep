name: Comprehensive Tests

on:
  pull_request:
    branches: [ production, master, main ]
  push:
    branches: [ production, master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for changed-files detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Setup Candlekeep (Download Models)
        run: |
          mkdir -p ~/.local/share/candlekeep
          python -m spacy download en_core_web_sm
          python << 'EOF'
          import os
          from pathlib import Path
          from sentence_transformers import SentenceTransformer, CrossEncoder
          
          models_dir = Path.home() / ".local" / "share" / "candlekeep" / "models"
          models_dir.mkdir(parents=True, exist_ok=True)
          
          print(f"Downloading Bi-Encoder to {models_dir}")
          SentenceTransformer("BAAI/bge-small-en-v1.5", cache_folder=str(models_dir))
          
          print(f"Downloading Cross-Encoder to {models_dir}")
          from sentence_transformers import CrossEncoder
          CrossEncoder("cross-encoder/ms-marco-MiniLM-L-6-v2", cache_folder=str(models_dir))
          EOF

      - name: Run Unit Tests
        env:
          XDG_DATA_HOME: /home/runner/.local/share
          CANDLEKEEP_DEVICE: cpu
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/test_router.py \
                 tests/test_quality_gate.py \
                 tests/test_arcane_recall_unit.py \
                 tests/test_protection.py \
                 tests/test_processor.py \
                 tests/test_providers.py \
                 tests/test_rate_limiter.py

      - name: Run Sanity Benchmarks
        env:
          XDG_DATA_HOME: /home/runner/.local/share
          CANDLEKEEP_DEVICE: cpu
          CHROMA_URL: http://localhost:8000
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/test_router_benchmark.py -v -s

      - name: Check for Integration Test Requirement
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/candlekeep/database/**
            src/candlekeep/config.py
            tests/test_vector_store.py
            tests/test_search.py

      - name: Run Integration Tests
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          XDG_DATA_HOME: /home/runner/.local/share
          CANDLEKEEP_DEVICE: cpu
          CHROMA_URL: http://localhost:8000
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/test_vector_store.py \
                 tests/test_search.py
